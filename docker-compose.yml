# ---------------------------------------------------------------------------
# Full local stack:  docker compose up --build
#   UI        http://localhost:8501
#   API       http://localhost:8000/docs
#   Qdrant    http://localhost:6333/dashboard
#   Prometheus http://localhost:9090   Grafana http://localhost:3000 (admin/admin)
#     (monitoring is a profile:  docker compose --profile monitoring up --build)
#
# Start order: qdrant + redis healthy -> one-shot `ingest` job -> api -> ui
# ---------------------------------------------------------------------------
x-api-env: &api-env
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-lite}
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: sqlite:////srv/state/app.db
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
  LOG_LEVEL: INFO

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  ingest:                      # batch ETL + indexing job (runs once, then exits)
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: {EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-lite}"}
    image: boot-search-api:local
    environment: *api-env
    command: ["python", "scripts/ingest.py"]
    depends_on:
      qdrant: {condition: service_healthy}

  api:
    image: boot-search-api:local
    environment: *api-env
    ports: ["8000:8000"]
    volumes: [api_state:/srv/state]
    depends_on:
      ingest: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  qdrant_data:
  api_state:
