# CI/CD: lint -> unit tests + retrieval quality gate -> build & push images -> deploy
name: ci

on:
  push: {branches: [main]}
  pull_request:

concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check app ui scripts tests
      - name: Unit + integration tests (includes the retrieval quality gate)
        run: pytest -q
      - name: Retrieval eval report
        run: |
          python -m app.evaluation.retrieval_eval > eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: eval-report, path: data/eval/report.json}

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/boot-search-api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/boot-search-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ui.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/boot-search-ui:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/boot-search-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: deploy with the Vercel CLI. Skip this job if you connected the repo in the
  # Vercel dashboard (Git integration deploys automatically on push).
  deploy-vercel:
    needs: docker
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_WITH_VERCEL_CLI == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g vercel
      - run: vercel deploy --prod --token "$VERCEL_TOKEN"
