apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: boot-search}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}   # zero-downtime deploys
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: "/metrics"}
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_GITHUB_USER/boot-search-api:latest
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: boot-search-config}}, {secretRef: {name: boot-search-secrets}}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 1Gi}}
          livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
          startupProbe: {httpGet: {path: /health, port: 8000}, failureThreshold: 30, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: boot-search}
spec: {selector: {app: api}, ports: [{port: 8000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: boot-search}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
