apiVersion: apps/v1
kind: Deployment
metadata: {name: ui, namespace: boot-search}
spec:
  replicas: 1
  selector: {matchLabels: {app: ui}}
  template:
    metadata: {labels: {app: ui}}
    spec:
      containers:
        - name: ui
          image: ghcr.io/YOUR_GITHUB_USER/boot-search-ui:latest
          env: [{name: API_URL, value: "http://api:8000"}]
          ports: [{containerPort: 8501}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
          readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}}
---
apiVersion: v1
kind: Service
metadata: {name: ui, namespace: boot-search}
spec: {selector: {app: ui}, ports: [{port: 8501}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boot-search
  namespace: boot-search
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # Streamlit websockets
spec:
  ingressClassName: nginx
  rules:
    - host: boots.example.com
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 8000}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: ui, port: {number: 8501}}}}
